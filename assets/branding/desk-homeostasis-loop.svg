<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="loopBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070d18"/>
      <stop offset="50%" stop-color="#0a1526"/>
      <stop offset="100%" stop-color="#040810"/>
    </linearGradient>

    <!-- Node Card Fill -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#162235"/>
      <stop offset="100%" stop-color="#0d1624"/>
    </linearGradient>

    <!-- Flow Conduit Gradient -->
    <linearGradient id="conduitGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <!-- Return Arc Gradient -->
    <linearGradient id="returnGrad" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <filter id="nodeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="520" rx="16" fill="url(#loopBg)"/>
  <rect width="1198" height="518" x="1" y="1" rx="15" fill="none" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Section Header -->
  <g text-anchor="middle">
    <text x="600" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" letter-spacing="4" fill="#38bdf8">
      THE HOMEOSTATIC REPAIR LOOP
    </text>
    <text x="600" y="74" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="400" fill="#94a3b8">
      Continuous Biomimetic Feedback: From Observation to Verified Equilibrium
    </text>
  </g>

  <!-- Returning Feedback Conduit (Stage 7 back to Stage 1) -->
  <path d="M 1050,330 C 1050,440 150,440 150,330" 
        fill="none" 
        stroke="url(#returnGrad)" 
        stroke-width="3" 
        stroke-dasharray="6 6" 
        opacity="0.7"/>
  <polygon points="144,320 150,340 156,320" fill="#38bdf8"/>
  <text x="600" y="455" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" letter-spacing="2" fill="#38bdf8" text-anchor="middle" opacity="0.8">
    CONTINUOUS HOMEOSTATIC SURVEILLANCE &amp; FEEDBACK LOOP
  </text>

  <!-- Forward Flow Connecting Conduits -->
  <g stroke="#0284c7" stroke-width="3" fill="none" opacity="0.6">
    <line x1="215" y1="200" x2="245" y2="200"/>
    <line x1="365" y1="200" x2="395" y2="200"/>
    <line x1="515" y1="200" x2="545" y2="200"/>
    <line x1="665" y1="200" x2="695" y2="200"/>
    <line x1="815" y1="200" x2="845" y2="200"/>
    <line x1="965" y1="200" x2="995" y2="200"/>
  </g>

  <!-- STAGE 1: SENSE -->
  <g transform="translate(90, 110)">
    <rect width="125" height="180" rx="10" fill="url(#cardBg)" stroke="#38bdf8" stroke-width="1.5"/>
    <circle cx="62" cy="40" r="22" fill="#0369a1" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="62" cy="40" r="7" fill="#ffffff"/>
    <text x="62" y="84" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">1. SENSE</text>
    <text x="62" y="104" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600" fill="#38bdf8" text-anchor="middle">Observation</text>
    <text x="62" y="130" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">
      <tspan x="62" dy="0">Observe active</tspan>
      <tspan x="62" dy="13">EasyEDA PCB &amp;</tspan>
      <tspan x="62" dy="13">schematic state</tspan>
    </text>
    <rect x="25" y="165" width="75" height="4" rx="2" fill="#0284c7"/>
  </g>

  <!-- STAGE 2: UNDERSTAND -->
  <g transform="translate(240, 110)">
    <rect width="125" height="180" rx="10" fill="url(#cardBg)" stroke="#0ea5e9" stroke-width="1.5"/>
    <circle cx="62" cy="40" r="22" fill="#075985" stroke="#0ea5e9" stroke-width="2"/>
    <path d="M 52,40 L 72,40 M 62,30 L 62,50" stroke="#ffffff" stroke-width="2"/>
    <text x="62" y="84" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">2. UNDERSTAND</text>
    <text x="62" y="104" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600" fill="#0ea5e9" text-anchor="middle">Intent &amp; Rules</text>
    <text x="62" y="130" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">
      <tspan x="62" dy="0">Establish electrical,</tspan>
      <tspan x="62" dy="13">thermal &amp; layout</tspan>
      <tspan x="62" dy="13">constraints</tspan>
    </text>
    <rect x="25" y="165" width="75" height="4" rx="2" fill="#0ea5e9"/>
  </g>

  <!-- STAGE 3: PROTECT -->
  <g transform="translate(390, 110)">
    <rect width="125" height="180" rx="10" fill="url(#cardBg)" stroke="#10b981" stroke-width="2" filter="url(#nodeGlow)"/>
    <circle cx="62" cy="40" r="22" fill="#065f46" stroke="#10b981" stroke-width="2"/>
    <!-- Shield Icon -->
    <path d="M 62,28 C 70,32 74,34 74,42 C 74,52 66,56 62,58 C 58,56 50,52 50,42 C 50,34 54,32 62,28 Z" fill="#10b981"/>
    <text x="62" y="84" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">3. PROTECT</text>
    <text x="62" y="104" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600" fill="#10b981" text-anchor="middle">Tolerance</text>
    <text x="62" y="130" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">
      <tspan x="62" dy="0">Lock healthy nets,</tspan>
      <tspan x="62" dy="13">freeze accepted</tspan>
      <tspan x="62" dy="13">copper tracks</tspan>
    </text>
    <rect x="25" y="165" width="75" height="4" rx="2" fill="#10b981"/>
  </g>

  <!-- STAGE 4: DIAGNOSE -->
  <g transform="translate(540, 110)">
    <rect width="125" height="180" rx="10" fill="url(#cardBg)" stroke="#f59e0b" stroke-width="1.5"/>
    <circle cx="62" cy="40" r="22" fill="#78350f" stroke="#f59e0b" stroke-width="2"/>
    <circle cx="60" cy="38" r="8" fill="none" stroke="#fbbf24" stroke-width="2"/>
    <line x1="66" y1="44" x2="72" y2="50" stroke="#fbbf24" stroke-width="2"/>
    <text x="62" y="84" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">4. DIAGNOSE</text>
    <text x="62" y="104" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600" fill="#f59e0b" text-anchor="middle">8-Domain Audit</text>
    <text x="62" y="130" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">
      <tspan x="62" dy="0">Audit defects,</tspan>
      <tspan x="62" dy="13">airwires, shorts,</tspan>
      <tspan x="62" dy="13">ampacity errors</tspan>
    </text>
    <rect x="25" y="165" width="75" height="4" rx="2" fill="#f59e0b"/>
  </g>

  <!-- STAGE 5: REPAIR -->
  <g transform="translate(690, 110)">
    <rect width="125" height="180" rx="10" fill="url(#cardBg)" stroke="#0284c7" stroke-width="1.5"/>
    <circle cx="62" cy="40" r="22" fill="#082f49" stroke="#0284c7" stroke-width="2"/>
    <path d="M 54,46 L 70,34 M 54,34 L 70,46" stroke="#38bdf8" stroke-width="2"/>
    <text x="62" y="84" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">5. REPAIR</text>
    <text x="62" y="104" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600" fill="#38bdf8" text-anchor="middle">Surgical Action</text>
    <text x="62" y="130" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">
      <tspan x="62" dy="0">Human-approved</tspan>
      <tspan x="62" dy="13">minimal-change</tspan>
      <tspan x="62" dy="13">surgical execution</tspan>
    </text>
    <rect x="25" y="165" width="75" height="4" rx="2" fill="#0284c7"/>
  </g>

  <!-- STAGE 6: VERIFY -->
  <g transform="translate(840, 110)">
    <rect width="125" height="180" rx="10" fill="url(#cardBg)" stroke="#6366f1" stroke-width="1.5"/>
    <circle cx="62" cy="40" r="22" fill="#312e81" stroke="#818cf8" stroke-width="2"/>
    <path d="M 52,40 L 59,47 L 72,33" fill="none" stroke="#a5b4fc" stroke-width="2.5" stroke-linecap="round"/>
    <text x="62" y="84" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">6. VERIFY</text>
    <text x="62" y="104" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600" fill="#818cf8" text-anchor="middle">Readback</text>
    <text x="62" y="130" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">
      <tspan x="62" dy="0">Read back physical</tspan>
      <tspan x="62" dy="13">canvas geometry</tspan>
      <tspan x="62" dy="13">independently</tspan>
    </text>
    <rect x="25" y="165" width="75" height="4" rx="2" fill="#6366f1"/>
  </g>

  <!-- STAGE 7: RESTORE HOMEOSTASIS -->
  <g transform="translate(990, 110)">
    <rect width="125" height="180" rx="10" fill="url(#cardBg)" stroke="#10b981" stroke-width="2" filter="url(#nodeGlow)"/>
    <circle cx="62" cy="40" r="22" fill="#064e3b" stroke="#34d399" stroke-width="2"/>
    <circle cx="62" cy="40" r="9" fill="#10b981"/>
    <circle cx="62" cy="40" r="4" fill="#ffffff"/>
    <text x="62" y="84" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">7. HOMEOSTASIS</text>
    <text x="62" y="104" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600" fill="#34d399" text-anchor="middle">8 Hard Gates</text>
    <text x="62" y="130" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">
      <tspan x="62" dy="0">Verify all 8 gates;</tspan>
      <tspan x="62" dy="13">re-establish design</tspan>
      <tspan x="62" dy="13">equilibrium</tspan>
    </text>
    <rect x="25" y="165" width="75" height="4" rx="2" fill="#10b981"/>
  </g>
</svg>
