<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0a192f" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#050b14" stop-opacity="1"/>
    </radialGradient>
    
    <!-- Core Luminous Gradient -->
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="20%" stop-color="#38bdf8"/>
      <stop offset="60%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#082f49" stop-opacity="0"/>
    </radialGradient>

    <!-- Teal Circuit Conduit Gradient -->
    <linearGradient id="cyanConduit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>

    <!-- Bio-Chitin Shield Gradient -->
    <linearGradient id="shieldPlate" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <linearGradient id="shieldEdge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#0ea5e9" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.9"/>
    </linearGradient>

    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="100" fill="url(#bgGlow)"/>
  <rect width="510" height="510" x="1" y="1" rx="99" fill="none" stroke="#1e293b" stroke-width="2"/>

  <!-- Cellular Outer Membrane / Micro-Vias -->
  <g opacity="0.3">
    <circle cx="256" cy="256" r="230" fill="none" stroke="#0ea5e9" stroke-width="1" stroke-dasharray="4 8"/>
    <circle cx="256" cy="256" r="215" fill="none" stroke="#334155" stroke-width="1.5"/>
    <circle cx="256" cy="41" r="3" fill="#38bdf8"/>
    <circle cx="256" cy="471" r="3" fill="#38bdf8"/>
    <circle cx="41" cy="256" r="3" fill="#38bdf8"/>
    <circle cx="471" cy="256" r="3" fill="#38bdf8"/>
  </g>

  <!-- Protective Biomorphic Chitin Shield -->
  <path d="M 256,48 
           C 340,78 416,110 436,192 
           C 448,242 444,324 394,392 
           C 348,454 286,482 256,494 
           C 226,482 164,454 118,392 
           C 68,324 64,242 76,192 
           C 96,110 172,78 256,48 Z" 
        fill="url(#shieldPlate)" 
        stroke="url(#shieldEdge)" 
        stroke-width="3.5"
        filter="drop-shadow(0px 12px 24px rgba(0,0,0,0.8))"/>

  <!-- Inner Homeostatic Shell -->
  <path d="M 256,92 
           C 318,116 376,140 390,204 
           C 398,244 394,306 356,360 
           C 320,410 274,432 256,442 
           C 238,432 192,410 156,360 
           C 118,306 114,244 122,204 
           C 136,140 194,116 256,92 Z" 
        fill="#0b1329" 
        stroke="#1e3a8a" 
        stroke-width="2" 
        opacity="0.85"/>

  <!-- Neural-Circuit Synaptic Pathways -->
  <g stroke="url(#cyanConduit)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Top Sensory Conduits -->
    <path d="M 256,92 L 256,160"/>
    <path d="M 256,160 L 210,195 L 170,195 L 145,225"/>
    <path d="M 256,160 L 302,195 L 342,195 L 367,225"/>

    <!-- Lateral Immune Pathways -->
    <path d="M 145,225 L 145,280 L 175,310 L 215,310 L 240,335"/>
    <path d="M 367,225 L 367,280 L 337,310 L 297,310 L 272,335"/>

    <!-- Ventral Homeostatic Spine -->
    <path d="M 256,345 L 256,440"/>
    <path d="M 240,335 L 256,350 L 272,335"/>
  </g>

  <!-- Circuit Vias & Synaptic Nodes -->
  <g fill="#0284c7" stroke="#38bdf8" stroke-width="1.5">
    <circle cx="256" cy="160" r="5"/>
    <circle cx="210" cy="195" r="4"/>
    <circle cx="302" cy="195" r="4"/>
    <circle cx="145" cy="225" r="4.5"/>
    <circle cx="367" cy="225" r="4.5"/>
    <circle cx="175" cy="310" r="4"/>
    <circle cx="337" cy="310" r="4"/>
    <circle cx="256" cy="440" r="5"/>
    <!-- Active Verified Synapse Nodes (Green) -->
    <circle cx="145" cy="280" r="3.5" fill="#10b981" stroke="#34d399"/>
    <circle cx="367" cy="280" r="3.5" fill="#10b981" stroke="#34d399"/>
    <!-- Sensor Receptor Nodes (Amber) -->
    <circle cx="170" cy="195" r="3" fill="#f59e0b" stroke="#fbbf24"/>
    <circle cx="342" cy="195" r="3" fill="#f59e0b" stroke="#fbbf24"/>
  </g>

  <!-- Central Sentinel Luminous Core -->
  <circle cx="256" cy="256" r="64" fill="url(#coreGlow)" filter="url(#glowFilter)"/>
  <circle cx="256" cy="256" r="38" fill="#082f49" stroke="#38bdf8" stroke-width="3"/>
  
  <!-- Biological Core Aperture / Geometric Sentinel Emblem -->
  <polygon points="256,230 278,243 278,269 256,282 234,269 234,243" 
           fill="#38bdf8" 
           stroke="#ffffff" 
           stroke-width="2"/>
  <circle cx="256" cy="256" r="5" fill="#ffffff"/>
</svg>
