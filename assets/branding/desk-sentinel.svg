<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <!-- Background Environment Gradient -->
    <radialGradient id="sentinelBg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0d1829" stop-opacity="1"/>
      <stop offset="60%" stop-color="#070d18" stop-opacity="1"/>
      <stop offset="100%" stop-color="#03070d" stop-opacity="1"/>
    </radialGradient>

    <!-- Deep Organic Armor Plating -->
    <linearGradient id="armorPlate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#223249"/>
      <stop offset="40%" stop-color="#141f30"/>
      <stop offset="100%" stop-color="#080e18"/>
    </linearGradient>

    <linearGradient id="innerChitin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1b2a3d"/>
      <stop offset="100%" stop-color="#0a121c"/>
    </linearGradient>

    <!-- Bioluminescent Circuit Gradients -->
    <linearGradient id="cyanTrace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="60%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>

    <linearGradient id="emeraldHealth" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Sentinel Core Radiation -->
    <radialGradient id="sentinelCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#7dd3fc"/>
      <stop offset="55%" stop-color="#0284c7" stop-opacity="0.8"/>
      <stop offset="85%" stop-color="#0369a1" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#0c4a6e" stop-opacity="0"/>
    </radialGradient>

    <!-- Glow Filters -->
    <filter id="coreGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16" result="blur1"/>
      <feGaussianBlur stdDeviation="30" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="800" fill="url(#sentinelBg)"/>

  <!-- Cellular PCB Grid / Micro-coordinate Matrix -->
  <g opacity="0.12" stroke="#38bdf8" stroke-width="0.75" fill="none">
    <!-- Concentric Homeostatic Boundary Rings -->
    <circle cx="600" cy="400" r="360" stroke-dasharray="4 8"/>
    <circle cx="600" cy="400" r="280" stroke-dasharray="2 12"/>
    <circle cx="600" cy="400" r="190"/>
    <!-- Subtle Coordinate Grids -->
    <path d="M 150,400 L 1050,400 M 600,80 L 600,720"/>
    <path d="M 280,180 L 920,620 M 280,620 L 920,180"/>
  </g>

  <!-- Lateral Peripheral Sensory Axons (Left & Right Wings) -->
  <g stroke="url(#cyanTrace)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.6">
    <!-- Left Sensory Cluster -->
    <path d="M 440,250 L 320,200 L 220,200 L 170,240 L 110,240"/>
    <path d="M 320,200 L 260,150 L 190,150"/>
    <path d="M 410,360 L 290,360 L 210,410 L 140,410"/>
    <path d="M 430,470 L 330,520 L 240,520 L 180,570"/>
    <!-- Right Sensory Cluster -->
    <path d="M 760,250 L 880,200 L 980,200 L 1030,240 L 1090,240"/>
    <path d="M 880,200 L 940,150 L 1010,150"/>
    <path d="M 790,360 L 910,360 L 990,410 L 1060,410"/>
    <path d="M 770,470 L 870,520 L 960,520 L 1020,570"/>
  </g>

  <!-- Peripheral Sensory Receptor Terminals (Amber & Cyan Vias) -->
  <g>
    <!-- Left Receptors -->
    <circle cx="110" cy="240" r="5" fill="#0284c7" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="190" cy="150" r="4" fill="#f59e0b" stroke="#fde68a" stroke-width="1.5"/>
    <circle cx="140" cy="410" r="4.5" fill="#0284c7" stroke="#38bdf8" stroke-width="1.5"/>
    <circle cx="180" cy="570" r="4" fill="#059669" stroke="#34d399" stroke-width="1.5"/>
    <!-- Right Receptors -->
    <circle cx="1090" cy="240" r="5" fill="#0284c7" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="1010" cy="150" r="4" fill="#f59e0b" stroke="#fde68a" stroke-width="1.5"/>
    <circle cx="1060" cy="410" r="4.5" fill="#0284c7" stroke="#38bdf8" stroke-width="1.5"/>
    <circle cx="1020" cy="570" r="4" fill="#059669" stroke="#34d399" stroke-width="1.5"/>
  </g>

  <!-- THE SENTINEL: PRIMARY EXOSKELETON / SHIELD MANDIBLE -->
  <!-- Outer Chitinous Membrane Plate -->
  <path d="M 600,100
           C 730,130 840,180 870,300
           C 890,380 880,500 800,600
           C 720,700 640,730 600,750
           C 560,730 480,700 400,600
           C 320,500 310,380 330,300
           C 360,180 470,130 600,100 Z"
        fill="url(#armorPlate)"
        stroke="#38bdf8"
        stroke-opacity="0.4"
        stroke-width="3"
        filter="drop-shadow(0px 20px 40px rgba(0,0,0,0.9))"/>

  <!-- Mid-Tier Laminar Shell Structure (Layered Biomorphic Segmentation) -->
  <path d="M 600,140
           C 700,165 790,210 815,310
           C 830,375 825,470 760,550
           C 695,630 635,660 600,675
           C 565,660 505,630 440,550
           C 375,470 370,375 385,310
           C 410,210 500,165 600,140 Z"
        fill="url(#innerChitin)"
        stroke="#0ea5e9"
        stroke-opacity="0.6"
        stroke-width="2"/>

  <!-- Segmented Ventral Plates (Shield Sternum) -->
  <path d="M 600,180 C 660,200 710,235 730,300 C 700,340 650,350 600,350 C 550,350 500,340 470,300 C 490,235 540,200 600,180 Z"
        fill="#0d1b2a" stroke="#1e3a8a" stroke-width="1.5"/>
  <path d="M 470,330 C 530,360 600,365 600,365 C 600,365 670,360 730,330 C 745,410 720,490 670,540 C 640,530 600,530 600,530 C 600,530 560,530 530,540 C 480,490 455,410 470,330 Z"
        fill="#0b1726" stroke="#1e3a8a" stroke-width="1.5"/>
  <path d="M 530,555 C 560,548 600,548 600,548 C 600,548 640,548 670,555 C 640,610 600,640 600,640 C 600,640 560,610 530,555 Z"
        fill="#09131f" stroke="#1e3a8a" stroke-width="1.5"/>

  <!-- Neural-Circuit Synaptic Bus (Main Stem Traces) -->
  <g stroke="url(#cyanTrace)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#subtleGlow)">
    <!-- Dorsal Ingestion Conduit -->
    <path d="M 600,100 L 600,180"/>
    <path d="M 600,180 L 530,230 L 490,230 L 460,270"/>
    <path d="M 600,180 L 670,230 L 710,230 L 740,270"/>
    
    <!-- Cardiac Core Circuit Enclosure -->
    <path d="M 460,270 L 460,340 L 500,380 L 520,380"/>
    <path d="M 740,270 L 740,340 L 700,380 L 680,380"/>

    <!-- Ventral Diagnostic Bus -->
    <path d="M 520,420 L 490,450 L 490,510 L 540,560 L 600,580 L 660,560 L 710,510 L 710,450 L 680,420"/>
    <path d="M 600,580 L 600,675"/>
  </g>

  <!-- Internal Health & Tolerance Synapses (Green / Verified State) -->
  <g fill="#10b981" stroke="#34d399" stroke-width="2">
    <circle cx="490" cy="230" r="5"/>
    <circle cx="710" cy="230" r="5"/>
    <circle cx="540" cy="560" r="4.5"/>
    <circle cx="660" cy="560" r="4.5"/>
    <circle cx="600" cy="675" r="6"/>
  </g>

  <!-- Inspection & Diagnostic Receptors (Amber / DRC Fault Isolation) -->
  <g fill="#f59e0b" stroke="#fbbf24" stroke-width="2">
    <circle cx="460" cy="270" r="5"/>
    <circle cx="740" cy="270" r="5"/>
    <circle cx="490" cy="510" r="4.5"/>
    <circle cx="710" cy="510" r="4.5"/>
  </g>

  <!-- Critical Fault Intercept Nodes (Red / Fail-Closed Guard Nodes) -->
  <g fill="#ef4444" stroke="#fca5a5" stroke-width="2">
    <circle cx="460" cy="340" r="4"/>
    <circle cx="740" cy="340" r="4"/>
  </g>

  <!-- CENTRAL LUMINOUS HOMEOSTATIC NUCLEUS (The Brain / Quality Core) -->
  <!-- Ambient Radiation Field -->
  <circle cx="600" cy="400" r="140" fill="url(#sentinelCore)" filter="url(#coreGlow)"/>

  <!-- Geometric Protective Iris (Double Hexagon & Cellular Pores) -->
  <polygon points="600,320 670,360 670,440 600,480 530,440 530,360"
           fill="#071220" stroke="#38bdf8" stroke-width="3" opacity="0.95"/>
  
  <polygon points="600,340 650,370 650,430 600,460 550,430 550,370"
           fill="#0b223d" stroke="#7dd3fc" stroke-width="1.5"/>

  <!-- Nucleus Core Emblem -->
  <circle cx="600" cy="400" r="26" fill="#38bdf8" filter="url(#subtleGlow)"/>
  <circle cx="600" cy="400" r="14" fill="#ffffff"/>
  
  <!-- Diagnostic Cross-Section Lines -->
  <line x1="565" y1="400" x2="635" y2="400" stroke="#0369a1" stroke-width="2"/>
  <line x1="600" y1="365" x2="600" y2="435" stroke="#0369a1" stroke-width="2"/>

  <!-- Typography / Brand Integration -->
  <text x="600" y="740" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
        font-size="16" 
        font-weight="700" 
        letter-spacing="6" 
        fill="#38bdf8" 
        text-anchor="middle" 
        opacity="0.8">
    THE SENTINEL
  </text>
  <text x="600" y="765" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
        font-size="11" 
        font-weight="500" 
        letter-spacing="3" 
        fill="#94a3b8" 
        text-anchor="middle" 
        opacity="0.6">
    HOMEOSTATIC ENGINEERING ORGANISM
  </text>
</svg>
